name: Backtest Buitre todas las monedas
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - backtest_buitre_todas.py
      - .github/workflows/backtest_buitre.yml
permissions:
  contents: write
concurrency:
  group: backtest-buitre
  cancel-in-progress: true
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: cache_buitre
          key: buitre-datos-${{ github.run_id }}
          restore-keys: buitre-datos-
      - name: Correr backtest
        run: python3 -u backtest_buitre_todas.py 2>&1 | tee log_buitre.txt
        continue-on-error: true
      - name: Guardar resultados en el repo
        if: always()
        run: |
          tail -c 20000 log_buitre.txt > resultado_buitre_todas_log.txt || true
          git config user.name "backtest-bot"
          git config user.email "backtest-bot@users.noreply.github.com"
          git add -f resultado_buitre_todas*.txt resultado_buitre_todas.json 2>/dev/null || true
          git commit -m "Resultados backtest Buitre todas las monedas" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && break
            sleep 15
          done
